services:
  - type: web
    name: optimizador-demo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Email de contacto para Nominatim (politica de uso). El valor se define en el panel de Render.
      - key: GEOCODING_EMAIL
        sync: false
